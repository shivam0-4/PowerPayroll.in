# ─────────────────────────────────────────────────────────────────────────────
#  GROUPON POWER – Nginx Reverse Proxy Config
# ─────────────────────────────────────────────────────────────────────────────
# Serves React SPA on /  and proxies all /api/* calls to the Flask backend.

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Static Frontend (React SPA) ──────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # Cache JS/CSS assets aggressively (Vite adds content hashes)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Always fall back to index.html for SPA client-side routing
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API Proxy ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts suitable for payroll calculation (can be slow)
        proxy_connect_timeout  30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    # ── Health endpoint exposed directly ──────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hide nginx version
    server_tokens off;
}
