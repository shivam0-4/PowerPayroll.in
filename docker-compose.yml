version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  GROUPON POWER – Production Docker Compose
#  Services: postgres · redis · backend (Flask/Gunicorn) · frontend (Nginx)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: groupon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-groupon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groupon_secure_pass_2026}
      POSTGRES_DB:       ${POSTGRES_DB:-groupon_power}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groupon} -d ${POSTGRES_DB:-groupon_power}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - groupon_net

  # ── Redis 7 (session cache / future job queue) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: groupon_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groupon_net

  # ── Flask Backend (Gunicorn) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: groupon_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-groupon}:${POSTGRES_PASSWORD:-groupon_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-groupon_power}
      REDIS_URL:       redis://redis:6379/0
      PORT:            5000
      FLASK_ENV:       production
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - groupon_net

  # ── React Frontend + Nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: groupon_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - groupon_net

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads:
    driver: local

# ── Internal Network ──────────────────────────────────────────────────────────
networks:
  groupon_net:
    driver: bridge
