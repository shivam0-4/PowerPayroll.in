version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  GROUPON POWER – Production Docker Compose (with SSL + Certbot)
#  For real-world hosting on a VPS (DigitalOcean / AWS / Hetzner etc.)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: groupon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-groupon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-groupon_power}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Do NOT expose 5432 externally in production — internal only
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groupon} -d ${POSTGRES_DB:-groupon_power}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - groupon_net

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: groupon_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - groupon_net

  # ── Flask Backend (Gunicorn) ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: groupon_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groupon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-groupon_power}
      REDIS_URL:    redis://:${REDIS_PASSWORD:-}@redis:6379/0
      PORT:         5000
      FLASK_ENV:    production
    volumes:
      - uploads:/app/uploads
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - groupon_net

  # ── Nginx (HTTP + HTTPS) ───────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: groupon_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certs from Certbot
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      # Override nginx config with SSL version after cert is issued
      - ./deploy/nginx/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - groupon_net

  # ── Certbot (Let's Encrypt SSL) ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: groupon_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Run once to issue cert, then auto-renew via cron on host
    entrypoint: >
      sh -c "
        certbot certonly --webroot
          --webroot-path /var/www/certbot
          --email ${CERTBOT_EMAIL}
          --agree-tos
          --no-eff-email
          -d ${DOMAIN}
          -d www.${DOMAIN}
        && echo 'SSL cert issued successfully'
      "
    profiles:
      - ssl-setup   # only runs when: docker compose --profile ssl-setup up certbot

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  pgdata:       { driver: local }
  redisdata:    { driver: local }
  uploads:      { driver: local }
  certbot_certs:{ driver: local }
  certbot_www:  { driver: local }

# ── Internal Network ──────────────────────────────────────────────────────────
networks:
  groupon_net:
    driver: bridge
